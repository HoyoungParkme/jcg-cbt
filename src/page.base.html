<title>정처기 기출 데스크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: 시험지 한 장을 책상 위에 올려둔 구도. 왼쪽 문제지, 오른쪽 해설·답안 현황. 장식 없이 선·여백·숫자로만 상태를 보여준다. */
:root{
  --bg:#eceff3; --paper:#ffffff; --paper-2:#f5f7fa; --fg:#171c23; --muted:#636d7a;
  --line:#d6dbe3; --line-strong:#b8c0cc;
  --accent:#1c4f87; --accent-soft:#e3ecf7; --accent-ink:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e3f2e9; --no:#b5362f; --no-bg:#f9e5e3; --mark:#b7791f; --mark-bg:#fbf0d9; --warn:#8a5a00;
  --shadow:0 1px 2px rgba(23,28,35,.06),0 8px 24px -12px rgba(23,28,35,.18);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,"D2Coding",monospace;
  --radius:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --paper:#1a2028; --paper-2:#222a34; --fg:#e6e9ee; --muted:#98a2b0; --line:#2d3643; --line-strong:#3e4957;
    --accent:#8bb8e8; --accent-soft:#1f3047; --accent-ink:#0f1620; --ok:#62c48f; --ok-bg:#163424; --no:#f08f88; --no-bg:#3d2120; --mark:#e2b457; --mark-bg:#3a2e14; --warn:#e0b25a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --paper:#1a2028; --paper-2:#222a34; --fg:#e6e9ee; --muted:#98a2b0; --line:#2d3643; --line-strong:#3e4957;
  --accent:#8bb8e8; --accent-soft:#1f3047; --accent-ink:#0f1620; --ok:#62c48f; --ok-bg:#163424; --no:#f08f88; --no-bg:#3d2120; --mark:#e2b457; --mark-bg:#3a2e14; --warn:#e0b25a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%;height:auto}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:52px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;background:none;border:0;padding:0;color:var(--fg)}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em}
.nav{display:flex;gap:2px;margin-left:12px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:6px 10px;border-radius:var(--radius);color:var(--muted);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--paper-2);color:var(--fg)}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:5px 9px;color:var(--muted);font-size:13px;white-space:nowrap}
.iconbtn:hover{color:var(--fg);border-color:var(--line-strong)}
@media (max-width:640px){.nav{margin-left:4px}.nav button{padding:6px 7px;font-size:13.5px}.brand{font-size:14px}.brand small{display:none}.iconbtn{padding:4px 7px;font-size:12px}.iconbtn .t{display:none}}

/* ---------- 공통 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--radius);padding:7px 14px;font-weight:500;font-size:14px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--paper-2)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.lg{padding:10px 22px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section{margin-top:36px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:17px;font-weight:600}
.section-head p{margin:0;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);line-height:1.5;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.no{color:var(--no);background:var(--no-bg);border-color:transparent}
.pill.mark{color:var(--mark);background:var(--mark-bg);border-color:transparent}
.pill.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--no)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;border:1px dashed var(--line-strong);border-radius:var(--radius)}
.lead{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:70ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--radius);font-size:13.5px;opacity:0;transition:.18s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--paper);border:0;padding:7px 16px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg.sm button{padding:3px 10px;font-size:12.5px}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:20px;font-weight:600}

/* ---------- 홈 ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-head h1{font-size:24px;font-weight:600;letter-spacing:-.015em}
.home-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.statline{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin-top:28px}
.statline div{flex:1 1 140px;padding:10px 16px;border-right:1px solid var(--line);min-width:0}
.statline div:last-child{border-right:0}
.statline .k{font-size:12px;color:var(--muted)}
.statline .v{font-size:20px;font-weight:600;letter-spacing:-.01em}
.statline .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
@media (max-width:640px){.statline div{flex-basis:50%;border-bottom:1px solid var(--line)}.statline div:nth-child(2n){border-right:0}.statline div:nth-last-child(-n+2){border-bottom:0}}
.resume{margin-top:20px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.resume b{font-weight:600}
.resume .sub{color:var(--muted);font-size:13px}
.resume .acts{display:flex;gap:6px;margin-left:auto}
@media (max-width:640px){.resume .acts{margin-left:0;width:100%}.resume .acts .btn{flex:1}}
.study{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:18px 20px;display:grid;gap:16px}
.study h2{font-size:16px;font-weight:600}
.study .row{display:grid;gap:8px}
.study .lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.opt:hover{border-color:var(--line-strong)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt b{font-weight:600}
.opt span{font-size:12.5px;color:var(--muted);line-height:1.5}
.study .go{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.study .go .note{font-size:12.5px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.quick button{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.quick button:hover{border-color:var(--accent)}
.quick button:disabled{opacity:.5;cursor:not-allowed}
.quick b{font-weight:600}
.quick span{font-size:13px;color:var(--muted)}
.quick .cnt{font-family:var(--mono);color:var(--accent);font-size:13px}
.recent{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow:hidden}
.recent table{width:100%;border-collapse:collapse;font-size:13.5px}
.recent th,.recent td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
.recent th{font-weight:500;color:var(--muted);font-size:12px}
.recent tr:last-child td{border-bottom:0}
.recent td.r{text-align:right}
.foot{margin-top:48px;font-size:12px;color:var(--muted);line-height:1.7}

/* ---------- 회차 목록 ---------- */
.year{margin-top:18px}
.year h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px}
.round{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.round .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.round .t b{font-weight:600;font-size:15px}
.round .t span{font-size:12px;color:var(--muted)}
.round .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.round .acts{display:flex;gap:6px}
.round .acts .btn{flex:1;padding:5px 6px;font-size:13px}

/* ---------- 단원 선택 ---------- */
.pick-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.pick-grid{grid-template-columns:1fr}}
.pick{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.pick-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.pick-h b{font-weight:600}
.ulist{display:flex;flex-direction:column;gap:4px}
.uitem{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.uitem:hover{border-color:var(--line-strong)}
.uitem.on{border-color:var(--accent);background:var(--accent-soft)}
.uitem input{margin:0}
.uitem .uk{font-size:12px;color:var(--muted);width:20px;text-align:right}
.uitem .un{min-width:0;display:flex;flex-direction:column;gap:3px}
.uitem .un b{font-weight:500;font-size:14px}
.uitem .un small{font-size:12px;color:var(--muted)}
.rlist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ryear{flex-basis:100%;margin-top:6px}
.ryear:first-child{margin-top:0}
.ritem{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:var(--mono)}
.ritem.on{border-color:var(--accent);background:var(--accent-soft)}
.ritem input{margin:0}
.ritem small{color:var(--muted);font-size:11px}
.pick-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pick-opts>div{display:flex;flex-direction:column;gap:6px}
.pick-start{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.pick-start span{color:var(--muted);font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{margin:4px 0 0}
.chk small{display:block;color:var(--muted);font-size:12px}

/* ---------- 풀이 화면 ---------- */
.sess-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sess-head h1{font-size:17px;font-weight:600}
.pager{display:flex;align-items:center;gap:6px}
.pager select{border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--radius);padding:4px 8px;font-size:13px}
.timer{font-family:var(--mono);font-size:15px;padding:3px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper)}
.timer.low{color:var(--no);border-color:var(--no)}
.progress{height:3px;background:var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.sess{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow:auto}
@media (max-width:1000px){.sess{grid-template-columns:1fr}.side{position:static;max-height:none;overflow:visible}.omr{display:none}.omr.open{display:block;position:fixed;inset:auto 0 0 0;max-height:75vh;overflow:auto;z-index:20;border-radius:12px 12px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.omr-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}}
.omr-backdrop{display:none}
.omr-toggle{display:none}
@media (max-width:1000px){.omr-toggle{display:inline-flex}}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px 20px;min-width:0}
@media (max-width:640px){.paper{padding:16px 16px 14px}}
.qmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.qmeta .qn{font-family:var(--mono);font-weight:600;color:var(--fg);font-size:15px;margin-right:4px}
.markbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--radius);padding:3px 9px;font-size:12.5px;color:var(--muted)}
.markbtn.on{color:var(--mark);border-color:var(--mark);background:var(--mark-bg)}
.stem{font-size:16px;font-weight:500;line-height:1.65;letter-spacing:-.005em;margin:0 0 14px;max-width:76ch;overflow-wrap:anywhere}
.stem p{margin:0 0 6px}
.stem .q-text{margin-bottom:8px}
.stem .q-spec{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:10px 0;font-weight:400;font-size:14.5px}
.stem .q-spec__label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.stem ul{margin:4px 0;padding-left:20px;font-weight:400}
.stem ul.is-labeled{list-style:none;padding-left:0}
.stem table,.explain table{border-collapse:collapse;font-size:13.5px;margin:6px 0;font-weight:400}
.stem td,.stem th,.explain td,.explain th{border:1px solid var(--line-strong);padding:4px 10px}
.stem th{background:var(--paper-2)}
.stem .tables-row{display:flex;gap:16px;flex-wrap:wrap}
.stem .q-tbl-title{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.stem pre,.stem .q-sql,.explain pre{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:8px 0;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow-x:auto;white-space:pre;tab-size:4;font-weight:400}
.stem .q-sql code,.stem pre code{font-family:var(--mono);white-space:pre}
.stem code{font-family:var(--mono);font-size:.95em}
.stem img{display:block;margin:8px 0;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.codewrap{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;margin:8px 0;font-weight:400}
.codewrap .gutter{user-select:none;padding:12px 10px 12px 12px;text-align:right;color:var(--muted);font-family:var(--mono);font-size:13.5px;line-height:1.55;border-right:1px solid var(--line);white-space:pre;opacity:.8}
.codewrap pre{border:0!important;background:transparent!important;flex:1;min-width:0;margin:0!important}
.hljs-keyword,.hljs-built_in,.hljs-type{color:var(--accent);font-weight:500}
.hljs-string,.hljs-meta-string{color:var(--ok)}
.hljs-number,.hljs-literal{color:var(--no)}
.hljs-comment{color:var(--muted);font-style:italic}
.hljs-title,.hljs-function .hljs-title{color:var(--mark)}
.hljs-meta{color:var(--warn)}
.choices{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.choices li{display:flex;gap:6px;align-items:stretch}
.choice{display:flex;gap:12px;align-items:flex-start;flex:1;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;line-height:1.55;font-size:15px;min-width:0;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--line-strong);background:var(--paper-2)}
.choice .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;margin-top:2px;color:var(--muted)}
.choice .c{min-width:0;overflow-wrap:anywhere}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.no{border-color:var(--no);background:var(--no-bg)}
.choice.no .n{background:var(--no);border-color:var(--no);color:#fff}
.choice.elim .c{text-decoration:line-through;color:var(--muted)}
.choice.elim .n{opacity:.5}
.choice:disabled{cursor:default}
.elim{flex:none;border:1px solid transparent;background:none;color:var(--muted);font-size:11.5px;padding:0 6px;border-radius:var(--radius);opacity:.6}
.elim:hover{opacity:1;border-color:var(--line)}
.elim.on{opacity:1;color:var(--no)}
.short{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.short-label{font-size:13px;font-weight:600}

<script src="data/manifest.js"></script>
<script src="data/notes.js"></script>
<script src="data/trace/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  "use strict";
  const M = window.CBT_MANIFEST;
  const NOTES = window.CBT_NOTES || {};
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const TRACK_NAME = { written: "필기", practical: "실기" };
  const EXAM_MINUTES = { written: 150, practical: 150 };   // 실제 시험 시간
  // open: 오픈북(정답을 펼쳐 두고 회독) / practice: 해설(문항마다 채점·해설) / exam: 시험(제출 후 한꺼번에 채점)
  const MODE_NAME = { open: "오픈북", practice: "해설", exam: "시험" };
  const CIRCLED = ["①", "②", "③", "④", "⑤"];
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const modePill = (m) => `<span class="pill ${m === "exam" ? "acc" : m === "open" ? "mark" : ""}">${MODE_NAME[m]}</span>`;
  const unitOf = (q) => q.unit;

  /* ================= 저장소 (localStorage, 실패해도 앱은 동작) ================= */
  const Store = {
    key: "cbtdesk.v2",
    data: null,
    load() {
      let raw = null;
      try { raw = JSON.parse(localStorage.getItem(this.key) || "null"); } catch (e) { raw = null; }
      this.data = Object.assign({ hist: {}, wrong: {}, marks: {}, days: {}, session: null, results: [], prefs: {} }, raw || {});
      this.data.prefs = Object.assign({ theme: "system", track: "written", mode: "practice", scope: "round" }, this.data.prefs || {});
    },
    save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* 저장 불가 환경이면 그냥 넘어간다 */ } },
  };
  Store.load();
  const S = Store.data;
  const P = S.prefs;

  /* ================= 데이터 로더 (회차 파일을 필요할 때만 script 태그로 읽는다) ================= */
  const Data = {
    cache: (window.CBT_DATA = window.CBT_DATA || {}),
    pending: {},
    index: {},
    load(track, round) {
      const key = track + "/" + round;
      if (this.cache[key]) { this.indexRound(key); return Promise.resolve(this.cache[key]); }
      if (this.pending[key]) return this.pending[key];
      this.pending[key] = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "data/" + track + "/" + round + ".js";
        s.onload = () => { delete this.pending[key]; if (this.cache[key]) { this.indexRound(key); resolve(this.cache[key]); } else reject(new Error("빈 데이터: " + key)); };
        s.onerror = () => { delete this.pending[key]; reject(new Error("불러오기 실패: " + key)); };
        document.head.appendChild(s);
      });
      return this.pending[key];
    },
    indexRound(key) {
      if (this.index[key]) return;
      const map = {}; this.cache[key].questions.forEach((q) => { map[q.id] = q; }); this.index[key] = map;
    },
    loadAll(track) { return Promise.all(M[track].rounds.map((r) => this.load(track, r.id))); },
    get(track, round, id) { const m = this.index[track + "/" + round]; return m ? m[id] : null; },
    roundLabel(track, round) { const r = M[track].rounds.find((x) => x.id === round); return r ? r.label : round; },
  };

  /* ================= 학습 기록 ================= */
  function recordAnswer(track, round, q, ok) {
    const h = S.hist[q.id] || { a: 0, c: 0 };
    h.a += 1; if (ok) h.c += 1; h.last = Date.now(); h.ok = ok; h.track = track; h.round = round; h.subj = unitOf(q);
    S.hist[q.id] = h;
    const snippet = { track, round, id: q.id, no: q.no, subj: unitOf(q), q: plainText(q.q).slice(0, 90) };
    if (ok) delete S.wrong[q.id];
    else S.wrong[q.id] = Object.assign(snippet, { t: Date.now(), n: ((S.wrong[q.id] || {}).n || 0) + 1 });
    S.days[today()] = (S.days[today()] || 0) + 1;
    Store.save();
  }
  function toggleMark(track, round, q) {
    if (S.marks[q.id]) delete S.marks[q.id];
    else S.marks[q.id] = { track, round, id: q.id, no: q.no, subj: unitOf(q), q: plainText(q.q).slice(0, 90), t: Date.now() };
    Store.save();
    return !!S.marks[q.id];
  }
  function plainText(html) { return String(html || "").replace(/<br\s*\/?>/gi, " ").replace(/<\/(div|p|li|tr)>/gi, " ").replace(/<[^>]*>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/&nbsp;/g, " ").replace(/&quot;/g, '"').replace(/\s+/g, " ").trim(); }
  function streakDays() {
    let n = 0; const d = new Date();
    if (!S.days[today()]) d.setDate(d.getDate() - 1);
    for (;;) {
      const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      if (!S.days[k]) break; n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }
  function roundProgress(track, roundId) {
    let solved = 0, correct = 0;
    Object.values(S.hist).forEach((h) => { if (h.track === track && h.round === roundId) { solved++; if (h.ok) correct++; } });
    return { solved, correct };
  }
  function unitProgress(track, unit) {
    let s = 0, c = 0;
    Object.values(S.hist).forEach((h) => { if (h.track === track && h.subj === unit) { s++; if (h.ok) c++; } });
    return { s, c };
  }

  /* ================= 단답형 채점 (허용 표기와 글자 단위 비교) ================= */
  function normAnswer(s) {
    return String(s || "").toLowerCase().replace(/[“”"'‘’`]/g, "").replace(/[,，、·]/g, " ").replace(/\s+/g, "").replace(/[;.]+$/, "");
  }
  function gradeShort(q, input) {
    const g = q.grade || {};
    if (g.t === "multi") {
      const per = g.a.map((acc, i) => acc.includes(normAnswer((input || [])[i])));
      return { ok: per.every(Boolean), per };
    }
    const ok = (g.a || []).includes(normAnswer(input));
    return { ok, per: [ok] };
  }
  const isSelfGraded = (q) => !q.grade || q.grade.t === "self";
  function answerText(q) { return plainText(String(q.answer || "").replace(/<br\s*\/?>/gi, " / ")); }

  /* ================= 세션 (풀이 1회분) ================= */
  let sess = null;
  let timerHandle = null;
  function newSession(opts) {
    sess = Object.assign({ idx: 0, ans: {}, graded: {}, elim: {}, start: Date.now(), submitted: false, limit: 0 }, opts);
    S.session = sess; Store.save();
  }
  function questionAt(i) { const r = sess.refs[i]; return Data.get(sess.track, r.round, r.id); }
  function curQ() { return questionAt(sess.idx); }
  function ensureLoaded(sessLike) {
    const rounds = Array.from(new Set(sessLike.refs.map((r) => r.round)));
    return Promise.all(rounds.map((r) => Data.load(sessLike.track, r)));
  }
  function hasInput(q) {
    const v = sess.ans[q.id];
    if (Array.isArray(v)) return v.some((x) => String(x || "").trim());
    return v !== undefined && v !== null && String(v).trim() !== "";
  }
  function scoreSession() {
    const by = {}; let total = 0, correct = 0, pendingSelf = 0, pts = 0, ptsTotal = 0;
    sess.refs.forEach((r) => {
      const q = Data.get(sess.track, r.round, r.id); if (!q) return;
      const subj = unitOf(q);
      by[subj] = by[subj] || { n: 0, c: 0 };
      by[subj].n++; total++;
      const p = sess.track === "practical" ? (q.points || 5) : 1; ptsTotal += p;
      const g = sess.graded[q.id];
      if (g === true) { by[subj].c++; correct++; pts += p; }
      if (sess.track === "practical" && isSelfGraded(q) && sess.submitted && g === undefined && hasInput(q)) pendingSelf++;
    });
    const score = ptsTotal ? Math.round((pts / ptsTotal) * 100) : 0;
    const subjects = Object.keys(by).map((k) => ({ name: k, n: by[k].n, c: by[k].c, pts: by[k].n ? Math.round((by[k].c / by[k].n) * 100) : 0 }));
    // 필기 과락은 회차 풀이(5과목 × 20문항)일 때만 의미가 있다
    const failSubj = sess.track === "written" && sess.kind === "round" ? subjects.filter((s) => s.pts < 40).map((s) => s.name) : [];
    return { total, correct, score, subjects, failSubj, pass: score >= 60 && failSubj.length === 0, pendingSelf };
  }

  /* 세션 만들기 */
  function startRound(track, round, mode) {
    busy(true);
    Data.load(track, round).then((d) => {
      newSession({ track, mode, kind: "round", title: Data.roundLabel(track, round) + " " + TRACK_NAME[track],
        refs: d.questions.map((q) => ({ round, id: q.id })), limit: mode === "exam" ? EXAM_MINUTES[track] * 60 : 0 });
      go("session");
    }).catch(fail).finally(() => busy(false));
  }
  function startAll(track, mode) {
    busy(true);
    Data.loadAll(track).then((all) => {
      const refs = []; all.forEach((d) => d.questions.forEach((q) => refs.push({ round: d.round, id: q.id })));
      newSession({ track, mode: mode || "practice", kind: "all", title: TRACK_NAME[track] + " 전체 " + refs.length + "문항", refs });
      go("session");
    }).catch(fail).finally(() => busy(false));
  }
  function weight(id) { const h = S.hist[id]; if (!h) return 2; return h.ok ? 0 : 3; }
  function startRandom(track, n, mode) {
    busy(true);
    Data.loadAll(track).then((all) => {
      const pool = []; all.forEach((d) => d.questions.forEach((q) => pool.push({ round: d.round, id: q.id })));
      newSession({ track, mode: mode || "practice", kind: "random", title: TRACK_NAME[track] + " 랜덤 " + n + "문제", refs: shuffle(pool).slice(0, n) });
      go("session");
    }).catch(fail).finally(() => busy(false));
  }
  function startFromList(list, track, title, mode) {
    const items = Object.values(list).filter((x) => x.track === track);
    if (!items.length) { toast("해당 문제가 없어요"); return; }
    busy(true);
    const fake = { track, refs: items.map((x) => ({ round: x.round, id: x.id })) };
    ensureLoaded(fake).then(() => {
      const refs = fake.refs.filter((r) => Data.get(track, r.round, r.id));
      newSession({ track, mode: mode || "practice", kind: "list", title, refs: refs.sort((a, b) => a.round.localeCompare(b.round) || (Data.get(track, a.round, a.id).no - Data.get(track, b.round, b.id).no)) });
      go("session");
    }).catch(fail).finally(() => busy(false));
  }
  function startSingle(item) {
    busy(true);
    Data.load(item.track, item.round).then(() => {
      if (!Data.get(item.track, item.round, item.id)) { toast("데이터가 바뀌어 이 문제를 찾을 수 없어요"); return; }
      newSession({ track: item.track, mode: "practice", kind: "list", title: Data.roundLabel(item.track, item.round) + " " + TRACK_NAME[item.track] + " " + item.no + "번", refs: [{ round: item.round, id: item.id }] });
      go("session");
    }).catch(fail).finally(() => busy(false));
  }
  function resumeSession() {
    busy(true);
    ensureLoaded(S.session).then(() => {
      sess = S.session;
      if (sess.pausedAt) { sess.pausedTotal = (sess.pausedTotal || 0) + Math.floor((Date.now() - sess.pausedAt) / 1000); delete sess.pausedAt; }
      go(sess.submitted ? "result" : "session");
    }).catch(fail).finally(() => busy(false));
  }
  function pauseAndSave() { if (sess && !sess.submitted) { sess.pausedAt = Date.now(); S.session = sess; Store.save(); } }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function fail(e) { console.error(e); toast("문제 데이터를 불러오지 못했어요. data 폴더가 index.html 옆에 있는지 확인해 주세요."); }
  function busy(on) { document.body.style.cursor = on ? "progress" : ""; }

  let resetArmed = false;

  /* ================= 회차 목록 ================= */
  function renderRounds() {
    const t = P.track, man = M[t], app = $("#app");
    const mode = P.mode;
    let html = `<div class="page-head"><button class="btn sm ghost" id="backBtn">← 학습 방식</button><h1>${TRACK_NAME[t]} · 회차별</h1>${modePill(mode)}<div class="spacer"></div>
      <div class="seg sm" id="modeSeg"><button class="${mode === "exam" ? "on" : ""}" data-mode="exam">시험</button><button class="${mode === "practice" ? "on" : ""}" data-mode="practice">해설</button><button class="${mode === "open" ? "on" : ""}" data-mode="open">오픈북</button></div></div>
      <p class="lead">${mode === "exam" ? `${EXAM_MINUTES[t]}분 타이머가 돌고, 제출하면 한꺼번에 채점합니다. ${t === "written" ? "과목당 40점 미만이면 과락, 평균 60점 이상이면 합격." : "60점 이상이면 합격."}` : mode === "practice" ? "문항마다 바로 채점하고 해설을 봅니다. 틀린 문제는 오답노트에 쌓입니다." : "정답과 해설을 펼쳐 둔 채 넘겨 봅니다. 기록은 남지 않습니다."} 평균 점수는 원본 사이트 응시자 평균입니다.</p>`;
    const byYear = {};
    man.rounds.slice().reverse().forEach((r) => { const y = r.id.split("-")[0]; (byYear[y] = byYear[y] || []).push(r); });
    Object.keys(byYear).sort((a, b) => b - a).forEach((y) => {
      html += `<div class="year"><h2>${y}년 시행</h2><div class="rounds">`;
      byYear[y].forEach((r) => {
        const p = roundProgress(t, r.id);
        const pct = p.solved ? Math.round((p.correct / p.solved) * 100) : null;
        html += `<div class="round">
          <div class="t"><b>${esc(r.label)}</b><span class="num">${r.n}문항${r.avg != null ? ` · 평균 ${r.avg}점` : ""}</span></div>
          <div class="bar"><i class="c" style="width:${(p.correct / r.n) * 100}%"></i><i class="w" style="width:${((p.solved - p.correct) / r.n) * 100}%"></i></div>
          <div class="meta"><span>${p.solved ? `${p.solved}문항 풀이` : "아직 안 풂"}</span><span class="num">${pct === null ? "" : "정답률 " + pct + "%"}</span></div>
          <div class="acts"><button class="btn primary" data-round="${r.id}">${MODE_NAME[mode]} 모드로 풀기</button></div>
        </div>`;
      });
      html += `</div></div>`;
    });
    app.innerHTML = html;
    $("#backBtn").addEventListener("click", () => go("home"));
    $$("#modeSeg button", app).forEach((b) => b.addEventListener("click", () => { P.mode = b.dataset.mode; Store.save(); renderRounds(); }));
    $$("[data-round]", app).forEach((b) => b.addEventListener("click", () => startRound(t, b.dataset.round, mode)));
  }

  /* ================= 단원별: 단원 + 회차 고르기 ================= */
  const unitPick = { track: "written", units: new Set(), rounds: new Set(), limit: 0, order: "seq", shuffleChoices: false };
  function openUnits(track, preselect) {
    unitPick.track = track; unitPick.units = new Set(preselect ? [preselect] : []); unitPick.rounds = new Set(M[track].rounds.map((r) => r.id));
    if (P.mode === "exam") { P.mode = "practice"; Store.save(); }
    go("units");
  }
  function renderUnits() {
    const t = unitPick.track, app = $("#app"), man = M[t], units = man.units;
    document.documentElement.dataset.track = t;
    const allRounds = man.rounds;
    const uc = man.unitCounts || {};
    let html = `<div class="page-head"><button class="btn sm ghost" id="backBtn">← 학습 방식</button><h1>${TRACK_NAME[t]} · 단원별</h1><div class="spacer"></div>
      <div class="seg sm" id="trackSeg"><button class="${t === "written" ? "on" : ""}" data-track="written">필기</button><button class="${t === "practical" ? "on" : ""}" data-track="practical">실기</button></div></div>
      <p class="lead">단원을 고른 뒤 풀 회차를 고르세요. 전 회차도, 여러 단원을 함께 푸는 것도 됩니다.</p>
      <div class="pick-grid">
        <section class="pick"><div class="pick-h"><b>단원</b><span><button class="btn sm ghost" data-units="all">전체 선택</button><button class="btn sm ghost" data-units="none">해제</button></span></div><div class="ulist">`;
    units.forEach((u) => {
      const p = unitProgress(t, u.name), on = unitPick.units.has(u.name);
      html += `<label class="uitem ${on ? "on" : ""}"><input type="checkbox" data-unit="${esc(u.name)}" ${on ? "checked" : ""}><span class="uk num">${u.no}</span><span class="un"><b>${esc(u.name)}</b><small class="num">${u.n}문항${p.s ? ` · ${p.s}문항 풀이 · 정답률 ${Math.round((p.c / p.s) * 100)}%` : ""}</small><span class="bar"><i class="c" style="width:${(p.c / u.n) * 100}%"></i><i class="w" style="width:${((p.s - p.c) / u.n) * 100}%"></i></span></span></label>`;
    });
    html += `</div></section>
        <section class="pick"><div class="pick-h"><b>회차</b><span><button class="btn sm ghost" data-rounds="all">전 회차</button><button class="btn sm ghost" data-rounds="none">해제</button></span></div><div class="rlist" id="rlist"></div>
          <div class="pick-opts">
            <div><span class="eyebrow">풀이 방식</span><div class="seg sm" id="modeSeg"><button class="${P.mode === "practice" ? "on" : ""}" data-mode="practice">해설</button><button class="${P.mode === "open" ? "on" : ""}" data-mode="open">오픈북</button></div></div>
            <div><span class="eyebrow">문항 수</span><div class="seg sm" id="limitSeg"><button class="${unitPick.limit === 0 ? "on" : ""}" data-limit="0">전체</button><button class="${unitPick.limit === 20 ? "on" : ""}" data-limit="20">20</button><button class="${unitPick.limit === 50 ? "on" : ""}" data-limit="50">50</button></div></div>
            <div><span class="eyebrow">순서</span><div class="seg sm" id="orderSeg"><button class="${unitPick.order === "seq" ? "on" : ""}" data-order="seq">회차 순</button><button class="${unitPick.order === "weak" ? "on" : ""}" data-order="weak">틀린 것 우선</button><button class="${unitPick.order === "rand" ? "on" : ""}" data-order="rand">섞기</button></div></div>
          </div>
          ${t === "written" ? `<label class="chk" style="margin-top:12px"><input type="checkbox" id="shufChoices" ${unitPick.shuffleChoices ? "checked" : ""}><span>보기 순서 섞기<small>보기 위치로 답을 외우는 것을 막습니다. 정답 확인과 결과에서는 원래 번호로 보여요.</small></span></label>` : ""}
          <div class="pick-start"><span id="pickCount" class="num"></span><button class="btn primary" id="startUnitsBtn">문제 풀기</button></div>
        </section></div>`;
    app.innerHTML = html;

    const renderRoundList = () => {
      // 선택한 단원의 회차별 문항 수를 보여 준다
      const counts = {}; allRounds.forEach((r) => { counts[r.id] = 0; });
      unitPick.units.forEach((u) => { Object.keys(uc[u] || {}).forEach((rid) => { counts[rid] += uc[u][rid]; }); });
      let h = ""; let lastYear = null;
      allRounds.slice().reverse().forEach((r) => {
        const y = r.id.split("-")[0];
        if (y !== lastYear) { lastYear = y; h += `<div class="ryear"><button class="btn sm ghost" data-year="${y}">${y}년 시행</button></div>`; }
        const on = unitPick.rounds.has(r.id);
        h += `<label class="ritem ${on ? "on" : ""}"><input type="checkbox" data-round="${r.id}" ${on ? "checked" : ""}>${r.id.split("-").slice(1).join("·")}회 <small>${unitPick.units.size ? counts[r.id] + "문항" : r.n + "문항"}</small></label>`;
      });
      $("#rlist").innerHTML = h;
      $$("input[data-round]", app).forEach((c) => c.addEventListener("change", () => { c.checked ? unitPick.rounds.add(c.dataset.round) : unitPick.rounds.delete(c.dataset.round); refresh(); }));
      $$("[data-year]", app).forEach((b) => b.addEventListener("click", () => {
        const ids = allRounds.filter((r) => r.id.startsWith(b.dataset.year + "-")).map((r) => r.id);
        const allOn = ids.every((id) => unitPick.rounds.has(id));
        ids.forEach((id) => allOn ? unitPick.rounds.delete(id) : unitPick.rounds.add(id));
        renderRoundList(); refresh();
      }));
    };
    const refresh = () => {
      $$(".uitem", app).forEach((l) => l.classList.toggle("on", unitPick.units.has(l.querySelector("input").dataset.unit)));
      $$(".ritem", app).forEach((l) => l.classList.toggle("on", unitPick.rounds.has(l.querySelector("input").dataset.round)));
      let est = 0; unitPick.units.forEach((u) => { unitPick.rounds.forEach((rid) => { est += (uc[u] || {})[rid] || 0; }); });
      $("#pickCount").textContent = unitPick.units.size && unitPick.rounds.size ? `${Array.from(unitPick.units).join(" + ")} · ${est}문항${unitPick.limit && est > unitPick.limit ? ` 중 ${unitPick.limit}문항` : ""}` : "단원과 회차를 고르세요";
      $("#startUnitsBtn").disabled = !(unitPick.units.size && unitPick.rounds.size && est);
    };
    $("#backBtn").addEventListener("click", () => go("home"));
    $$("#trackSeg button", app).forEach((b) => b.addEventListener("click", () => openUnits(b.dataset.track)));
    $$("input[data-unit]", app).forEach((c) => c.addEventListener("change", () => { c.checked ? unitPick.units.add(c.dataset.unit) : unitPick.units.delete(c.dataset.unit); renderRoundList(); refresh(); }));
    $$("[data-units]", app).forEach((b) => b.addEventListener("click", () => { unitPick.units = new Set(b.dataset.units === "all" ? units.map((u) => u.name) : []); $$("input[data-unit]", app).forEach((c) => { c.checked = unitPick.units.has(c.dataset.unit); }); renderRoundList(); refresh(); }));
    $$("[data-rounds]", app).forEach((b) => b.addEventListener("click", () => { unitPick.rounds = new Set(b.dataset.rounds === "all" ? allRounds.map((r) => r.id) : []); renderRoundList(); refresh(); }));
    $$("#modeSeg button", app).forEach((b) => b.addEventListener("click", () => { P.mode = b.dataset.mode; Store.save(); $$("#modeSeg button").forEach((x) => x.classList.toggle("on", x === b)); }));
    $$("#limitSeg button", app).forEach((b) => b.addEventListener("click", () => { unitPick.limit = Number(b.dataset.limit); $$("#limitSeg button").forEach((x) => x.classList.toggle("on", x === b)); refresh(); }));
    $$("#orderSeg button", app).forEach((b) => b.addEventListener("click", () => { unitPick.order = b.dataset.order; $$("#orderSeg button").forEach((x) => x.classList.toggle("on", x === b)); }));
    const sc = $("#shufChoices"); if (sc) sc.addEventListener("change", () => { unitPick.shuffleChoices = sc.checked; });
    $("#startUnitsBtn").addEventListener("click", startUnits);
    renderRoundList(); refresh();
  }
  function startUnits() {
    const t = unitPick.track, rounds = M[t].rounds.filter((r) => unitPick.rounds.has(r.id));
    busy(true);
    Promise.all(rounds.map((r) => Data.load(t, r.id))).then((ds) => {
      let refs = [];
      ds.forEach((d) => d.questions.forEach((q) => { if (unitPick.units.has(unitOf(q))) refs.push({ round: d.round, id: q.id }); }));
      if (!refs.length) { toast("고른 조건에 해당하는 문제가 없어요"); return; }
      if (unitPick.order === "rand") refs = shuffle(refs);
      else if (unitPick.order === "weak") refs = shuffle(refs).sort((a, b) => weight(b.id) - weight(a.id));
      if (unitPick.limit) refs = refs.slice(0, unitPick.limit);
      const names = Array.from(unitPick.units); const title = (names.length > 2 ? `${names[0]} 외 ${names.length - 1}단원` : names.join(" + ")) + (rounds.length === M[t].rounds.length ? "" : ` · ${rounds.length}회차`);
      newSession({ track: t, mode: P.mode === "exam" ? "practice" : P.mode, kind: "unit", title, refs, shufChoices: !!unitPick.shuffleChoices, perm: {} });
      go("session");
    }).catch(fail).finally(() => busy(false));
  }
  // 보기 순서 섞기: 문항별 순열을 세션에 저장해 두고, 화면 번호 ↔ 원래 번호를 바꿔 준다
  function choiceOrder(q) {
    if (!sess.shufChoices) return q.choices.map((_, k) => k + 1);
    sess.perm = sess.perm || {};
    if (!sess.perm[q.id]) { sess.perm[q.id] = shuffle(q.choices.map((_, k) => k + 1)); }
    return sess.perm[q.id];
  }

  /* ================= 풀이 화면 (왼쪽 문제 · 오른쪽 해설) ================= */
  function renderSession() {
    if (!sess) { go("home"); return; }
    const app = $("#app");
    document.documentElement.dataset.track = sess.track;
    const isExam = sess.mode === "exam";
    const n = sess.refs.length;
    app.innerHTML = `
      <div class="sess-head">
        <button class="btn sm ghost" id="exitBtn">← ${isExam && !sess.submitted ? "중단" : "목록"}</button>
        <h1 id="sessTitle">${esc(sess.title)}</h1>
        ${modePill(sess.mode)}
        <div class="spacer"></div>
        ${isExam && sess.limit ? `<span class="timer num" id="timer"></span>` : ""}
        <button class="btn sm omr-toggle" id="omrToggle">답안 현황</button>
        <div class="pager">
          <button class="btn sm" id="prevBtn">← 이전</button>
          <select id="posSel" class="num" aria-label="문항 이동">${sess.refs.map((r, i) => `<option value="${i}">${i + 1} / ${n}</option>`).join("")}</select>
          <button class="btn sm primary" id="nextBtn">다음 →</button>
        </div>
      </div>
      <div class="progress"><i id="prog"></i></div>
      <div class="sess">
        <article class="paper" id="paper"></article>
        <div class="side">
          <section class="panel" id="panel"></section>
          <div class="omr-backdrop" id="omrBackdrop"></div>
          <aside class="omr" id="omr"></aside>
        </div>
      </div>
      <div class="kbd">단축키 <kbd>1</kbd>–<kbd>4</kbd> 선택 · <kbd>Enter</kbd> 채점/다음 · <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>B</kbd> 저장 · <kbd>[</kbd><kbd>]</kbd> 실행 추적 단계</div>`;
    $("#prevBtn").addEventListener("click", () => move(-1));
    $("#nextBtn").addEventListener("click", () => move(1));
    $("#posSel").addEventListener("change", (e) => jumpTo(Number(e.target.value)));
    $("#exitBtn").addEventListener("click", exitSession);
    $("#omrToggle").addEventListener("click", () => toggleOmr());
    $("#omrBackdrop").addEventListener("click", () => toggleOmr(false));
    renderQuestion();
    renderOmr();
    if (isExam && sess.limit) startTimer();
  }
  function toggleOmr(force) {
    const o = $("#omr"), b = $("#omrBackdrop"); if (!o) return;
    const open = force === undefined ? !o.classList.contains("open") : force;
    o.classList.toggle("open", open); b.classList.toggle("open", open);
  }
  function backView() { return sess.kind === "unit" ? "units" : sess.kind === "round" ? "rounds" : "home"; }
  function exitSession() {
    if (sess.mode === "exam" && !sess.submitted) {
      const b = $("#exitBtn");
      if (b.dataset.armed) { pauseAndSave(); go("home"); return; }
      b.dataset.armed = "1"; b.textContent = "정말 중단? (다시 누르기)"; b.classList.remove("ghost");
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "← 중단"; b.classList.add("ghost"); } }, 3000);
      return;
    }
    if (sess.submitted) { S.session = null; Store.save(); } else pauseAndSave();
    go(backView());
  }
  function persist() { if (!sess.submitted) S.session = sess; Store.save(); }

  function renderQuestion() {
    const q = curQ(); if (!q) return;
    const i = sess.idx, n = sess.refs.length;
    if (sess.mode === "open" && (sess.seen || 0) < i + 1) {   // 여기까지 읽은 것으로 기록
      sess.seen = i + 1;
      if ($("#omrGrid")) { for (let k = 0; k <= i; k++) { const b = $(`#omrGrid button[data-i="${k}"]`); if (b) b.classList.add("a"); } const c = $("#omrCount"); if (c) c.textContent = sess.seen + " / " + n; }
    }
    const isExam = sess.mode === "exam", isOpen = sess.mode === "open";
    const graded = sess.graded[q.id];
    const selfPending = !!(sess.selfPending && sess.selfPending[q.id]);
    const revealed = isOpen || (isExam ? sess.submitted : graded !== undefined || selfPending);
    $("#posSel").value = String(i);
    $("#prog").style.width = ((i + 1) / n) * 100 + "%";
    $("#prevBtn").disabled = i === 0;
    $("#nextBtn").disabled = i === n - 1;

    /* ---- 왼쪽: 문제 카드 ---- */
    const [year, ...rn] = sess.refs[i].round.split("-");
    const tags = q.rate != null ? `<span class="pill num" title="복원 데이터 응시자 정답률">정답률 ${q.rate}%</span>${q.rate < 40 ? '<span class="pill no">킬러</span>' : ""}` : sess.track === "practical" ? `<span class="pill mark">배점 ${q.points || 5}점</span>` : "";
    let html = `<div class="qmeta"><span class="qn">Q.${i + 1}</span><span class="pill num">${year}년</span><span class="pill num">${rn.join("·")}회</span><span class="pill acc">${esc(unitOf(q))}</span>${tags}
      <button class="markbtn ${S.marks[q.id] ? "on" : ""}" id="markBtn">${S.marks[q.id] ? "★ 저장됨" : "☆ 저장"}</button></div>`;
    html += `<div class="stem">${q.q}</div>`;
    if (sess.track === "written") {
      const order = choiceOrder(q);
      const elim = sess.elim[q.id] || [];
      html += `<ul class="choices" role="listbox">`;
      order.forEach((orig, k) => {
        const shown = k + 1, sel = sess.ans[q.id] === orig;
        let cls = "choice";
        if (revealed) { if (orig === q.ans) cls += " ok"; else if (sel) cls += " no"; }
        else { if (sel) cls += " sel"; if (elim.includes(orig)) cls += " elim"; }
        html += `<li><button class="${cls}" data-choice="${orig}" ${revealed ? "disabled" : ""}><span class="n">${revealed && sess.shufChoices ? orig : shown}</span><span class="c">${q.choices[orig - 1]}</span></button>${revealed || isOpen ? "" : `<button class="elim ${elim.includes(orig) ? "on" : ""}" data-elim="${orig}" title="틀린 것 같은 보기에 줄 긋기">소거</button>`}</li>`;
      });
      html += `</ul>`;
    } else if (!isOpen) {
      html += renderShortInputs(q, revealed);
    }
    html += `<div class="paper-acts" id="paperActs"></div>`;
    $("#paper").innerHTML = html;

    /* ---- 오른쪽: 해설 패널 ---- */
    let panel = `<div class="panel-h"><b>해설</b><span><button class="btn sm ghost" id="copyBtn" title="문제·정답·해설을 텍스트로 복사">복사</button><button class="btn sm ghost" id="askBtn" title="AI 채팅에 붙여 넣어 상세 해설을 요청하는 프롬프트를 복사">AI에게 묻기</button></span></div>`;
    if (isOpen) {
      panel += sess.track === "written"
        ? `<div class="feedback wait"><span>정답</span><span class="ans"><b>${CIRCLED[q.ans - 1]}</b> ${plainText(q.choices[q.ans - 1])}</span></div>`
        : `<div class="feedback wait"><span>모범답안</span><span class="ans">${q.answer}</span></div>`;
      panel += renderExplain(q);
    } else if (revealed) {
      if (sess.track === "written") {
        const ok = graded === true;
        panel += `<div class="feedback ${ok ? "ok" : "no"}"><span>${ok ? "정답" : sess.ans[q.id] ? "오답" : "미응답"}</span><span class="ans">정답 <b>${CIRCLED[q.ans - 1]}</b> ${plainText(q.choices[q.ans - 1])}</span></div>`;
      } else {
        const self = isSelfGraded(q);
        if (graded === undefined && self) {
          panel += `<div class="feedback wait"><span>모범답안</span><span class="ans">${q.answer}</span>
            <span class="selfgrade"><button class="btn sm" data-self="1">맞음</button><button class="btn sm" data-self="0">틀림</button></span></div>`;
        } else {
          const ok = graded === true;
          panel += `<div class="feedback ${ok ? "ok" : "no"}"><span>${ok ? "정답" : hasInput(q) ? "오답" : "미응답"}</span><span class="ans">모범답안 <b>${q.answer}</b></span>${!ok && !self ? `<span class="selfgrade"><button class="btn sm ghost" data-self="1" title="표기만 달랐다면 정답으로 처리">정답으로 인정</button></span>` : ""}</div>`;
        }
      }
      panel += renderExplain(q);
    } else {
      panel += `<div class="panel-empty">${isExam ? "시험 모드에서는 제출한 뒤에 정답과 해설이 표시됩니다." : sess.track === "written" ? "왼쪽에서 보기를 고르면 여기에 정답과 해설이 표시됩니다." : "왼쪽에 답을 적고 <b>정답 확인</b>을 누르면 여기에 모범답안과 해설이 표시됩니다."}</div>`;
    }
    if (revealed && TI[q.id]) {   // 코드 문항: 실행 추적을 해설보다 먼저 보여 준다
      const traceHtml = `<div class="trace" id="trace"><div class="trace-h"><b>실행 추적</b><span class="hint">실제로 실행한 결과를 한 줄씩 따라갑니다</span></div><div class="trace-note">불러오는 중…</div></div>`;
      panel = panel.includes('<div class="explain">') ? panel.replace('<div class="explain">', traceHtml + '<div class="explain">') : panel + traceHtml;
    }
    $("#panel").innerHTML = panel;
    if (revealed && TI[q.id]) mountTrace(q.id);

    /* ---- 이벤트 ---- */
    $("#markBtn").addEventListener("click", () => { const on = toggleMark(sess.track, sess.refs[i].round, q); $("#markBtn").className = "markbtn" + (on ? " on" : ""); $("#markBtn").textContent = on ? "★ 저장됨" : "☆ 저장"; renderOmr(); });
    $$("[data-choice]").forEach((b) => b.addEventListener("click", () => choose(Number(b.dataset.choice))));
    $$("[data-elim]").forEach((b) => b.addEventListener("click", () => { const num = Number(b.dataset.elim); const list = sess.elim[q.id] || []; sess.elim[q.id] = list.includes(num) ? list.filter((x) => x !== num) : list.concat(num); persist(); renderQuestion(); }));
    $$("[data-self]").forEach((b) => b.addEventListener("click", () => selfGrade(b.dataset.self === "1")));
    const ta = $("#shortInput"); if (ta) { ta.addEventListener("input", () => { sess.ans[q.id] = ta.value; persist(); updateOmrCell(i); }); ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); checkShort(); } }); }
    $$("#shortMulti input").forEach((inp) => { inp.addEventListener("input", () => { sess.ans[q.id] = $$("#shortMulti input").map((x) => x.value); persist(); updateOmrCell(i); }); inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); checkShort(); } }); });
    $$(".tabs button", $("#panel")).forEach((b) => b.addEventListener("click", () => { $$(".tabs button", $("#panel")).forEach((x) => x.classList.toggle("on", x === b)); $("#panel .explain .body").innerHTML = b.dataset.html; $("#panel .explain .note").textContent = b.dataset.note || ""; }));
    $("#copyBtn").addEventListener("click", () => copyQuestion(q, revealed, false));
    $("#askBtn").addEventListener("click", () => copyQuestion(q, revealed, true));
    highlightIn($("#paper .stem"));
    renderMidActs();
    if (ta && !revealed) ta.focus({ preventScroll: true });
    const firstBlank = $("#shortMulti input"); if (firstBlank && !revealed) firstBlank.focus({ preventScroll: true });
  }

  function renderShortInputs(q, revealed) {
    const g = q.grade || {}, v = sess.ans[q.id];
    const res = revealed && !isSelfGraded(q) && hasInput(q) ? gradeShort(q, v) : null;
    let html = `<div class="short"><div class="short-label">정답 입력</div>`;
    if (g.t === "multi") {
      html += `<div id="shortMulti" style="display:flex;flex-direction:column;gap:6px">`;
      g.l.forEach((lbl, k) => {
        const cls = res ? (res.per[k] ? "ok" : "no") : "";
        html += `<label class="blank"><span class="lbl">${esc(lbl)}</span><input type="text" class="${cls}" value="${esc((v || [])[k] || "")}" autocomplete="off" spellcheck="false" ${revealed ? "readonly" : ""} placeholder="답"></label>`;
      });
      html += `</div>`;
    } else {
      const cls = res ? (res.ok ? "ok" : "no") : "";
      html += `<textarea id="shortInput" class="${cls}" rows="3" spellcheck="false" ${revealed ? "readonly" : ""} placeholder="${isSelfGraded(q) ? "답안을 서술하세요 (모범답안을 보고 직접 채점)" : "답을 적고 Enter (자동 채점)"}">${esc(v || "")}</textarea>`;
    }
    if (!revealed) html += `<div class="hint">${isSelfGraded(q) ? "서술형은 모범답안을 보고 스스로 채점합니다" : "대소문자·공백·한영 표기 차이는 같은 답으로 봅니다"}</div>`;
    html += `</div>`;
    return html;
  }

  function renderExplain(q) {
    const ex = q.explain || {};
    const tabs = [];
    if (ex.mine) tabs.push({ label: "정리 해설", html: ex.mine, note: "" });
    if (ex.user) tabs.push({ label: "등록자 해설", html: ex.user, note: "원 데이터 이용자가 남긴 해설입니다." });
    if (ex.ai) tabs.push({ label: "AI 해설", html: ex.ai, note: "자동 생성된 해설이라 틀린 설명이 섞여 있을 수 있습니다." });
    let html = `<div class="explain">`;
    if (tabs.length) {
      html += `<div class="tabs">${tabs.map((t, i) => `<button class="${i === 0 ? "on" : ""}" data-html="${esc(t.html)}" data-note="${esc(t.note)}">${t.label}</button>`).join("")}</div>
        <div class="body">${tabs[0].html}</div><div class="note">${esc(tabs[0].note)}</div>`;
    } else {
      html += `<div class="none">이 문항에는 아직 해설이 없습니다. 위의 <b>AI에게 묻기</b>로 문제를 복사해 AI 채팅에 붙여 넣으면 상세 해설을 받을 수 있어요.</div>`;
    }
    if (q.wiki && q.wiki.length) html += `<div class="wiki">${q.wiki.map((w) => `<a href="${esc(w.url)}" target="_blank" rel="noopener">IT위키 · ${esc(w.title)} ↗</a>`).join("")}</div>`;
    if (q.warn && q.warn.length) html += `<div class="warnline">⚠ ${q.warn.map((w) => ({ doubt: "복원 데이터 간 정답이 서로 달라 이견이 있는 문항입니다.", ambiguous: "문항 표현이 모호해 해석이 갈릴 수 있습니다.", truncated: "복원본에서 일부가 잘렸을 수 있는 문항입니다.", mismatch: "복원 데이터 간 보기 내용이 다른 문항입니다." }[w] || w)).join(" ")}</div>`;
    html += `</div>`;
    return html;
  }

  function renderMidActs() {
    const q = curQ(); const box = $("#paperActs"); if (!box) return;
    const isExam = sess.mode === "exam", i = sess.idx, last = i === sess.refs.length - 1;
    const graded = sess.graded[q.id] !== undefined || !!(sess.selfPending && sess.selfPending[q.id]);
    let html = "";
    if (sess.mode === "open") {
      html = last ? `<button class="btn primary" id="doneBtn">회독 마치기</button>` : `<button class="btn primary" id="nextBtn2">다음 문제 →</button>`;
    } else if (isExam && !sess.submitted) {
      const answered = sess.refs.filter((r) => { const qq = Data.get(sess.track, r.round, r.id); return qq && hasInputFor(qq); }).length;
      html += last ? "" : `<button class="btn primary" id="nextBtn2">다음 문제 →</button>`;
      html += `<button class="btn ${last ? "primary" : "ghost"}" id="submitBtn">제출하고 채점 <span class="num">(${answered}/${sess.refs.length})</span></button>`;
    } else if (sess.submitted) {
      html = `${last ? "" : `<button class="btn" id="nextBtn2">다음 문제 →</button>`}<button class="btn primary" id="toResultBtn">결과 보기</button>`;
    } else if (!graded) {
      html = sess.track === "practical" ? `<button class="btn primary" id="checkBtn">정답 확인</button>` : `<span class="hint">보기를 고르면 바로 채점됩니다</span>`;
    } else {
      html = `<button class="btn" id="retryBtn">다시 풀기</button>` + (last ? `<button class="btn primary" id="finishBtn">마치고 결과 보기</button>` : `<button class="btn primary" id="nextBtn2">다음 문제 →</button>`);
    }
    box.innerHTML = html;
    const cb = $("#checkBtn"); if (cb) cb.addEventListener("click", checkShort);
    const sb = $("#submitBtn"); if (sb) sb.addEventListener("click", confirmSubmit);
    const rb = $("#toResultBtn"); if (rb) rb.addEventListener("click", () => go("result"));
    const fb = $("#finishBtn"); if (fb) fb.addEventListener("click", () => { sess.submitted = true; persist(); go("result"); });
    const db = $("#doneBtn"); if (db) db.addEventListener("click", () => { S.session = null; Store.save(); go(backView()); toast("회독을 마쳤어요"); });
    const nb = $("#nextBtn2"); if (nb) nb.addEventListener("click", () => move(1));
    const rt = $("#retryBtn"); if (rt) rt.addEventListener("click", retryQuestion);
  }
  // 다시 풀기: 이 문항의 답과 채점만 지운다 (학습 기록은 그대로)
  function retryQuestion() {
    const q = curQ();
    delete sess.ans[q.id]; delete sess.graded[q.id]; if (sess.selfPending) delete sess.selfPending[q.id];
    persist(); renderQuestion(); updateOmrCell(sess.idx);
  }
  function hasInputFor(q) { const v = sess.ans[q.id]; return Array.isArray(v) ? v.some((x) => String(x || "").trim()) : v !== undefined && v !== null && String(v).trim() !== ""; }

  // 문제·정답·해설을 텍스트로 복사. ask=true 면 AI 채팅용 요청문을 앞에 붙인다
  function copyQuestion(q, revealed, ask) {
    const lines = [`[정보처리기사 ${TRACK_NAME[sess.track]} · ${Data.roundLabel(sess.track, sess.refs[sess.idx].round)} ${q.no}번 · ${unitOf(q)}]`, plainText(q.q.replace(/<\/(pre|code)>/g, "\n").replace(/\n/g, "⏎")).replace(/⏎/g, "\n")];
    if (sess.track === "written") q.choices.forEach((c, k) => lines.push(`${k + 1}. ${plainText(c)}`));
    if (revealed || ask) {
      lines.push("", "정답: " + (sess.track === "written" ? `${q.ans}. ${plainText(q.choices[q.ans - 1])}` : answerText(q)));
      const ex = q.explain || {}; const body = ex.mine || ex.user || ex.ai;
      if (body && !ask) lines.push("", "해설: " + plainText(body));
    }
    if (ask) lines.push("", "위 문제의 상세 해설을 아래 형식으로 작성해 주세요.", "1. 핵심 개념: 문제 풀이에 필요한 개념을 중학생도 이해할 수 있는 비유와 함께 설명", "2. 보기별 정오 판단: 각 보기가 맞거나 틀린 근거", "3. 관련 키워드 표: 함께 외워야 할 용어를 표로 정리", "4. 암기법: 쉽게 기억하는 방법 한 줄", "5. 복습 문제: 같은 개념을 묻는 변형 문제 2개 (정답은 마지막에 따로)");
    copyText(lines.join("\n"), ask ? "AI 채팅에 붙여 넣을 요청문을 복사했어요" : "문제를 클립보드에 복사했어요");
  }

  /* 선택지 선택: 해설 모드는 즉시 채점, 시험 모드는 저장만 */
  function choose(num) {
    const q = curQ();
    if (sess.mode === "open") return;
    if (sess.mode === "exam") {
      if (sess.submitted) return;
      sess.ans[q.id] = sess.ans[q.id] === num ? undefined : num;
      persist(); renderQuestion(); updateOmrCell(sess.idx); return;
    }
    if (sess.graded[q.id] !== undefined) return;
    sess.ans[q.id] = num;
    const ok = num === q.ans;
    sess.graded[q.id] = ok;
    recordAnswer(sess.track, sess.refs[sess.idx].round, q, ok);
    persist(); renderQuestion(); updateOmrCell(sess.idx);
  }
  function checkShort() {
    const q = curQ();
    if (sess.mode === "exam") { if (!sess.submitted) { persist(); toast("저장했어요. 제출할 때 한꺼번에 채점됩니다"); move(1); } return; }
    if (sess.graded[q.id] !== undefined) { move(1); return; }
    if (!hasInput(q)) { toast("답을 먼저 적어 주세요"); return; }
    if (isSelfGraded(q)) { sess.selfPending = sess.selfPending || {}; sess.selfPending[q.id] = true; persist(); renderQuestion(); return; }
    const ok = gradeShort(q, sess.ans[q.id]).ok;
    sess.graded[q.id] = ok;
    recordAnswer(sess.track, sess.refs[sess.idx].round, q, ok);
    persist(); renderQuestion(); updateOmrCell(sess.idx);
  }
  function selfGrade(ok) {
    const q = curQ();
    const wasGraded = sess.graded[q.id] !== undefined;
    if (wasGraded && !(sess.graded[q.id] === false && ok)) return;
    sess.graded[q.id] = ok;
    if (sess.selfPending) delete sess.selfPending[q.id];
    if (wasGraded) { const h = S.hist[q.id]; if (h) { h.c += 1; h.ok = true; } delete S.wrong[q.id]; Store.save(); }
    else recordAnswer(sess.track, sess.refs[sess.idx].round, q, ok);
    if (sess.submitted && sess.resultIdx !== undefined && S.results[sess.resultIdx]) { const sc = scoreSession(); Object.assign(S.results[sess.resultIdx], { score: sc.score, pass: sc.pass }); Store.save(); }
    persist(); renderQuestion(); updateOmrCell(sess.idx);
  }
  function move(d) {
    const n = sess.refs.length, next = sess.idx + d;
    if (next < 0 || next >= n) return;
    sess.idx = next; persist(); renderQuestion(); markCurrentCell(); toggleOmr(false);
    const paper = $("#paper"); if (paper && paper.getBoundingClientRect().top < 0) paper.scrollIntoView({ block: "start" });
  }
  function jumpTo(i) { sess.idx = i; persist(); renderQuestion(); markCurrentCell(); toggleOmr(false); }

  /* 제출 */
  let submitArmed = false;
  function confirmSubmit() {
    const b = $("#submitBtn"); if (!b) return;
    const unanswered = sess.refs.filter((r) => { const q = Data.get(sess.track, r.round, r.id); return q && !hasInputFor(q); }).length;
    if (!submitArmed && unanswered) { submitArmed = true; b.textContent = `미응답 ${unanswered}문항, 그래도 제출 (다시 누르기)`; setTimeout(() => { submitArmed = false; if (b.isConnected) renderMidActs(); }, 3500); return; }
    submitArmed = false; submitExam();
  }
  function submitExam() {
    stopTimer();
    sess.submitted = true; sess.endedAt = Date.now();
    sess.refs.forEach((r) => {
      const q = Data.get(sess.track, r.round, r.id); if (!q) return;
      let ok = null;
      if (sess.track === "written") ok = sess.ans[q.id] === q.ans;
      else if (!isSelfGraded(q)) ok = hasInputFor(q) ? gradeShort(q, sess.ans[q.id]).ok : false;
      else if (!hasInputFor(q)) ok = false;
      if (ok !== null) { sess.graded[q.id] = ok; recordAnswer(sess.track, r.round, q, ok); }
    });
    const sc = scoreSession();
    S.results = S.results || []; S.results.push({ ts: Date.now(), title: sess.title, score: sc.score, pass: sc.pass }); if (S.results.length > 30) S.results.shift();
    sess.resultIdx = S.results.length - 1;
    S.session = null; Store.save();
    go("result");
  }

  /* 타이머 */
  function startTimer() {
    const el = $("#timer"); if (!el) return;
    const tick = () => {
      const used = Math.floor((Date.now() - sess.start) / 1000) - (sess.pausedTotal || 0);
      const left = sess.limit - used;
      if (left <= 0) { el.textContent = "00:00"; stopTimer(); toast("시험 시간이 끝나 자동 제출합니다"); submitExam(); return; }
      const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
      el.textContent = (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      el.classList.toggle("low", left < 600);
    };
    tick(); timerHandle = setInterval(tick, 1000);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  /* 답안 현황판 */
  function cellClass(i) {
    const q = questionAt(i); if (!q) return "";
    const isExam = sess.mode === "exam", g = sess.graded[q.id];
    let cls = [];
    if (sess.mode === "open") { if (i < (sess.seen || 0)) cls.push("a"); }
    else if (isExam && !sess.submitted) { if (hasInputFor(q)) cls.push("a"); }
    else if (g === true) cls.push("o"); else if (g === false) cls.push("x"); else if (hasInputFor(q)) cls.push("a");
    if (S.marks[q.id]) cls.push("m");
    if (i === sess.idx) cls.push("cur");
    return cls.join(" ");
  }
  function answeredCount() { return sess.mode === "open" ? Math.min(sess.seen || 0, sess.refs.length) : sess.refs.filter((r, i) => { const q = questionAt(i); return q && (sess.graded[q.id] !== undefined || hasInputFor(q)); }).length; }
  function renderOmr() {
    const o = $("#omr"); if (!o) return;
    const isExam = sess.mode === "exam", isOpen = sess.mode === "open";
    let html = `<div class="h"><b>${isOpen ? "회독 현황" : "문항 탐색"}</b><span class="num" id="omrCount">${answeredCount()} / ${sess.refs.length}</span></div>
      <div class="legend">${isOpen ? `<span class="a"><i></i>읽음</span>` : isExam && !sess.submitted ? `<span class="a"><i></i>응답</span>` : `<span class="o"><i></i>정답</span><span class="x"><i></i>오답</span>`}<span class="m"><i></i>저장</span></div><div class="grid" id="omrGrid">`;
    let lastKey = null;
    sess.refs.forEach((r, i) => {
      const q = questionAt(i);
      const key = sess.kind === "round" && sess.track === "written" ? (q && unitOf(q)) : sess.kind === "all" || sess.kind === "unit" ? r.round : null;
      if (key && key !== lastKey) { lastKey = key; html += `<div class="subjhead">${esc(sess.kind === "round" ? key : Data.roundLabel(sess.track, key))}</div>`; }
      html += `<button class="${cellClass(i)}" data-i="${i}" title="${i + 1}번">${i + 1}</button>`;
    });
    html += `</div><div class="acts">${isExam && !sess.submitted ? `<button class="btn sm" id="omrSubmit">제출하고 채점</button>` : sess.submitted ? `<button class="btn sm" id="omrResult">결과 보기</button>` : ""}</div>`;
    o.innerHTML = html;
    $("#omrGrid").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) jumpTo(Number(b.dataset.i)); });
    const s = $("#omrSubmit"); if (s) s.addEventListener("click", () => { toggleOmr(false); const sb = $("#submitBtn"); if (sb) sb.click(); });
    const r = $("#omrResult"); if (r) r.addEventListener("click", () => go("result"));
  }
  function updateOmrCell(i) {
    const b = $(`#omrGrid button[data-i="${i}"]`); if (b) b.className = cellClass(i);
    const c = $("#omrCount"); if (c) c.textContent = answeredCount() + " / " + sess.refs.length;
    renderMidActs();
  }
  function markCurrentCell() { $$("#omrGrid button").forEach((b) => b.classList.toggle("cur", Number(b.dataset.i) === sess.idx)); const cur = $("#omrGrid button.cur"); if (cur) cur.scrollIntoView({ block: "nearest" }); }

  /* ================= 결과 ================= */
  function renderResult() {
    if (!sess) { go("home"); return; }
    const sc = scoreSession();
    const isExam = sess.mode === "exam";
    const app = $("#app");
    const mins = sess.endedAt ? Math.round((sess.endedAt - sess.start) / 60000) : null;
    let html = `<div class="result">
      <div class="score">
        <div class="big num">${sc.score}<small>점</small></div>
        <div class="meta"><b>${esc(sess.title)}</b><span>${sc.total}문항 중 ${sc.correct}문항 정답${mins !== null ? ` · ${mins}분 소요` : ""}</span>
          ${isExam ? `<span><span class="pill ${sc.pass ? "ok" : "no"}">${sc.pass ? "합격" : "불합격"}</span>${sc.failSubj.length ? ` <span style="color:var(--no)">과락: ${sc.failSubj.map(esc).join(", ")}</span>` : ""}${sc.pendingSelf ? ` <span style="color:var(--warn)">자가채점 대기 ${sc.pendingSelf}문항</span>` : ""}</span>` : `<span>해설 모드 · 합격 판정은 시험 모드에서 합니다</span>`}
        </div>
        <div class="acts"><button class="btn" id="reviewBtn">문제 다시 보기</button><button class="btn primary" id="homeBtn">목록으로</button></div>
      </div>`;
    if (sc.subjects.length > 1) {
      const failable = sess.track === "written" && sess.kind === "round";
      html += `<div class="subjscore"><h3>${sess.track === "written" ? "과목별" : "단원별"} 점수</h3>`;
      sc.subjects.forEach((s) => {
        html += `<div class="srow"><div class="name">${esc(s.name)}</div><div class="track"><i class="${failable && s.pts < 40 ? "fail" : ""}" style="width:${s.pts}%"></i>${failable ? `<span class="cut" style="left:40%" data-l="40"></span><span class="cut" style="left:60%" data-l="60"></span>` : ""}</div><div class="pts ${failable && s.pts < 40 ? "fail" : ""}">${s.pts}점 <span style="color:var(--muted);font-size:12px">(${s.c}/${s.n})</span></div></div>`;
      });
      html += failable ? `<div class="cutnote">과목당 100점 만점. 40점 미만이 한 과목이라도 있으면 과락, 전 과목 평균 60점 이상이면 합격입니다.</div>` : "";
      html += `</div>`;
    }
    const wrongs = sess.refs.map((r, i) => ({ i, q: Data.get(sess.track, r.round, r.id), round: r.round })).filter((x) => x.q && sess.graded[x.q.id] !== true);

      $$(".trace-ctl button", box).forEach((b) => b.addEventListener("click", () => show({ first: 0, prev: k - 1, next: k + 1, last: steps.length - 1 }[b.dataset.t])));
      $("#trange").addEventListener("input", (e) => show(Number(e.target.value)));
      box.dataset.ready = "1"; box._show = (d) => show(k + d);
      show(k);
    }).catch(() => { const box = $("#trace"); if (box) box.querySelector(".trace-note").textContent = "추적 데이터를 불러오지 못했어요."; });
  }

  /* ================= 키보드 ================= */
  document.addEventListener("keydown", (e) => {
    if (view !== "session" || !sess) return;
    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea" || tag === "select";
    if (e.key === "Escape") { toggleOmr(false); return; }
    if (typing) return;
    if (/^[1-5]$/.test(e.key) && sess.track === "written") { const q = curQ(); const order = choiceOrder(q); const orig = order[Number(e.key) - 1]; if (orig) { e.preventDefault(); choose(orig); } return; }
    if (e.key === "[" || e.key === "]") { const t = $("#trace"); if (t && t._show) { e.preventDefault(); t._show(e.key === "]" ? 1 : -1); } return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); move(1); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      const q = curQ();
      if (sess.mode === "practice" && sess.graded[q.id] === undefined && sess.track === "practical") { checkShort(); return; }
      if (sess.idx === sess.refs.length - 1) { const f = $("#finishBtn") || $("#submitBtn") || $("#toResultBtn") || $("#doneBtn"); if (f) f.click(); return; }
      move(1); return;
    }
    if (e.key === "b" || e.key === "B") { const mb = $("#markBtn"); if (mb) mb.click(); }
  });

  /* ================= 테마 ================= */
  function applyTheme() {
    const t = P.theme || "system";
    if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    $("#themeBtn").innerHTML = "테마<span class=\"t\">: " + { system: "시스템", light: "라이트", dark: "다크" }[t] + "</span>";
  }
  $("#themeBtn").addEventListener("click", () => { const order = ["system", "light", "dark"]; P.theme = order[(order.indexOf(P.theme || "system") + 1) % 3]; Store.save(); applyTheme(); });

  /* ================= 유틸 ================= */
  let toastT = null;
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2400); }
  function copyText(text, okMsg) {
    const done = () => toast(okMsg);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("복사하지 못했어요"); } ta.remove(); }

  window.addEventListener("beforeunload", pauseAndSave);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { pauseAndSave(); return; }
    if (sess && sess.pausedAt) { sess.pausedTotal = (sess.pausedTotal || 0) + Math.floor((Date.now() - sess.pausedAt) / 1000); delete sess.pausedAt; persist(); }
  });

  applyTheme();
  go("home");
})();
</script>
